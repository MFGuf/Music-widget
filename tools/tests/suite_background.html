<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>suite: background</title>
</head>
<body>
<script src="/tools/tests/suite_common.js"></script>

<script>
"use strict";

// Стабы browser API. Настоящие вызовы расширения мы перехватываем, чтобы
// проверять решения фоновой страницы без живого Firefox.

window.__calls = [];
window.__listeners = {};

function record(name, args) {
  window.__calls.push({ name: name, args: args });
}

window.browser = {
  runtime: {
    connectNative: function (name) {
      record("connectNative", [name]);
      // Намеренно не резолвимся: в тесте подключение к хосту управляется
      // вручную через window.__resolveHost().
      return new Promise(function (resolve, reject) {
        window.__hostResolve = resolve;
        window.__hostReject = reject;
      });
    },
    onInstalled: { addListener: function (f) { window.__listeners.installed = f; } },
    onStartup: { addListener: function (f) { window.__listeners.startup = f; } },
    onMessage: { addListener: function (f) { window.__listeners.runtimeMessage = f; } },
    getURL: function (p) { return "moz-extension://music-widget-test/" + p; },
    getManifest: function () { return { version: "0.1.0" }; },
  },
  tabs: {
    query: function (q) {
      record("tabs.query", [q]);
      return Promise.resolve(window.__tabs || []);
    },
    sendMessage: function (tabId, msg) {
      record("tabs.sendMessage", [tabId, msg]);
      if (window.__sendMessageImpl) {
        return window.__sendMessageImpl(tabId, msg);
      }
      return Promise.resolve({ ok: true, msg: "stub" });
    },
    onUpdated: { addListener: function (f) { window.__listeners.tabUpdated = f; } },
    onRemoved: { addListener: function (f) { window.__listeners.tabRemoved = f; } },
    executeScript: function () { return Promise.resolve([]); },
  },
  webRequest: {
    onBeforeRequest: { addListener: function (f, filt, extra) {
      window.__listeners.webRequest = f;
      window.__webRequestFilter = filt;
      window.__webRequestExtra = extra;
    } },
  },
  storage: {
    local: {
      get: function () { return Promise.resolve({}); },
      set: function () { return Promise.resolve(); },
    },
  },
};

// Подключение к хосту: имитируем успех или провал.
window.__resolveHost = function () {
  if (window.__hostResolve) {
    window.__hostResolve(makeFakePort());
  }
};
window.__rejectHost = function (err) {
  if (window.__hostReject) {
    window.__hostReject(err || new Error("нет такого приложения"));
  }
};

window.__sentToHost = [];

function makeFakePort() {
  var port = {
    onMessage: { addListener: function (f) { port._onMessage = f; } },
    onDisconnect: { addListener: function (f) { port._onDisconnect = f; } },
    postMessage: function (msg) {
      window.__sentToHost.push(JSON.parse(JSON.stringify(msg)));
    },
  };
  return port;
}

// Порт, созданный connectNative, должен быть доступен тесту.
window.browser.runtime.connectNative = (function (orig) {
  return function (name) {
    window.__calls.push({ name: "connectNative", args: [name] });
    return new Promise(function (resolve, reject) {
      window.__hostResolve = function () { resolve(makeFakePort()); };
      window.__hostReject = reject;
    });
  };
})();

window.__portMessage = function (msg) {
  var port = host.port;
  if (port && port._onMessage) {
    port._onMessage(msg);
  }
};

window.__portDisconnect = function (err) {
  var port = host.port;
  if (port && port._onDisconnect) {
    port._onDisconnect(err);
  }
};

window.__lastState = function () {
  for (var i = window.__sentToHost.length - 1; i >= 0; i--) {
    if (window.__sentToHost[i].t === "state") {
      return window.__sentToHost[i];
    }
  }
  return null;
};
</script>

<!-- Фоновые скрипты в порядке загрузки из page.html -->
<script src="/extension/background/protocol.js"></script>
<script src="/extension/background/store.js"></script>
<script src="/extension/background/native.js"></script>
<script src="/extension/background/tabs.js"></script>
<script src="/extension/background/api.js"></script>
<script src="/extension/background/art.js"></script>
<script src="/extension/background/page.js"></script>

<script>
"use strict";

// connectNative резолвится микро-задачей, поэтому после разыменования
// промиса нужно отдать управление планировщику, иначе порт ещё не создан.
function tick() {
  return new Promise(function (resolve) { setTimeout(resolve, 0); });
}

(async function () {
  try {
    // --- protocol.js -------------------------------------------------------

    assert("isVkHost: основной домен", isVkHost("https://vk.com/music") === true);
    assert("isVkHost: music-поддомен", isVkHost("https://music.vk.com/") === true);
    assert("isVkHost: vk.ru", isVkHost("https://vk.ru/music") === true);
    assert("isVkHost: чужой домен vk.com.evil.net", isVkHost("https://vk.com.evil.net/music") === false);
    assert("isVkHost: не URL", isVkHost("не url") === false);
    assert("isVkHost: пусто", isVkHost("") === false);

    assert("isMusicPage: /music", isMusicPage("https://vk.com/music5") === true);
    assert("isMusicPage: artist-страница", isMusicPage("https://vk.com/music-123456_7890123") === true);
    assert("isMusicPage: обычная страница VK", isMusicPage("https://vk.com/feed") === false);
    assert("isMusicPage: другой сайт", isMusicPage("https://youtube.com/music") === false);

    assertEqual("makeKey", makeKey(42), "tab:42");
    assertEqual("makeCacheKey", makeCacheKey(1, "Song", "Artist"), "1|Song|Artist");

    assertEqual("clamp01: больше 1", clamp01(1.5), 1);
    assertEqual("clamp01: меньше 0", clamp01(-2), 0);
    assertEqual("clamp01: NaN", clamp01("мусор"), 0);
    assertEqual("clamp01: строка-число", clamp01("0.25"), 0.25);

    assertEqual("trimText: схлопывает пробелы", trimText("  a \n b  "), "a b");
    assertEqual("trimText: обрезает длинный текст", trimText("x".repeat(300)).length, 200);
    assertEqual("trimText: обрезает по своему лимиту", trimText("x".repeat(300), 50).length, 50);
    assertEqual("trimText: null", trimText(null), "");
    assertEqual("trimText: не ломает эмодзи", trimText("хит 🔥"), "хит 🔥");

    // --- native.js ---------------------------------------------------------

    assert("native: константа протокола совпадает", PROTOCOL_VERSION === 1);
    assert("native: имя хоста совпадает с реестром", HOST_NAME === "music_widget_host");
    assertEqual("native: до подключения порта нет", host.port, null);

    // Подключение к хосту: успех.
    window.__resolveHost();
    await tick();
    assert("native: порт создан", host.port !== null);
    assertEqual("native: hello уходит сразу", window.__sentToHost[0].t, "hello");
    assertEqual("native: в hello есть версия", window.__sentToHost[0].v, PROTOCOL_VERSION);

    // Команда из виджета должна дойти до обработчика. Подменяем onCommand
// шпионом, который дополнительно вызывает настоящий обработчик - иначе
// проверки маршрутизации ниже потеряют смысл.
    var got = null;
    var realCommand = host.onCommand;
    host.onCommand = function (msg) {
      got = msg;
      return realCommand(msg);
    };
    window.__portMessage({ v: PROTOCOL_VERSION, t: "cmd", id: 7, action: "toggle", key: "tab:1" });
    assert("native: команда доставлена", got !== null && got.action === "toggle", JSON.stringify(got));

    // Сообщение чужой версии игнорируем.
    got = null;
    window.__portMessage({ v: 999, t: "cmd", id: 8, action: "toggle", key: "tab:1" });
    assert("native: чужая версия протокола отброшена", got === null);

    // Неизвестный тип не должен ронять обработчик.
    got = null;
    window.__portMessage({ v: PROTOCOL_VERSION, t: "ерунда" });
    assert("native: неизвестный тип игнорируется", got === null);

    // ping -> pong
    window.__sentToHost.length = 0;
    window.__portMessage({ v: PROTOCOL_VERSION, t: "ping" });
    assertEqual("native: ping отвечает pong", window.__sentToHost[0].t, "pong");

    // Слишком большое сообщение должно ужать обложки, а не упасть.
    window.__sentToHost.length = 0;
    var fat = [];
    for (var i = 0; i < 12; i++) {
      fat.push({ key: "tab:" + i, title: "трек " + i, art: "A".repeat(120000), art_new: true });
    }
    var sent = sendToHost({ t: "state", items: fat });
    assert("native: большое сообщение принято", sent === true);
    var st = window.__lastState();
    if (st) {
      var bytes = new TextEncoder().encode(JSON.stringify(st)).length;
      assert("native: большое сообщение ужато до лимита", bytes <= 900 * 1024, "стало " + bytes + " байт");
      assert("native: ужатое сообщение не потеряло источники", st.items.length === fat.length,
        "осталось " + st.items.length);
      assert("native: обложки убраны", st.items[0].art === "");
    }

    // Обрыв порта -> переподключение, но не чаще, чем раз в серию.
    window.__portDisconnect({ message: "виджет закрыт" });
    assert("native: обрыв сбрасывает соединение", host.connected === false);
    assert("native: запланировано переподключение", host.retryTimer !== null);
    var before = window.__calls.filter(function (c) { return c.name === "connectNative"; }).length;
    window.__portDisconnect({ message: "повтор" });
    assert("native: повторный обрыв не плодит таймеры",
      window.__calls.filter(function (c) { return c.name === "connectNative"; }).length === before);
    host.retryTimer = null;
    host.retryDelayMs = 1000;

    // Без соединения отправка не должна падать - просто отказывает.
    assertEqual("native: без порта отправка отказывает", sendToHost({ t: "state", items: [] }), false);

    // Хост не зарегистрирован: connectNative отклоняется.
    window.__calls.length = 0;
    connectHost();
    window.__rejectHost(new Error("No such native application music_widget_host"));
    await tick();
    await tick();
    assert("native: ошибка подключения попала в lastError", lastError.indexOf("native host") >= 0, lastError);
    assert("native: после ошибки запланирован повтор", host.retryTimer !== null);
    host.retryTimer = null;

    // --- tabs.js ------------------------------------------------------------

    // Автоматический таймер мешал бы проверкам - он мог бы опросить
    // вкладки в середине теста.
    if (pollTimer !== null) {
      clearInterval(pollTimer);
      pollTimer = null;
    }

    // При загрузке страницы start() сам запускает первый опрос. Он мог бы
    // подхватить тестовые вкладки и обновить выбор источника прямо
    // посреди проверки, поэтому сначала гасим его и ждём завершения.
    window.__tabs = [];
    await tick();
    await tick();
    for (var w = 0; w < 20 && polling; w++) {
      await tick();
    }
    assert("tabs: стартовый опрос завершился до проверок", polling === false);

    // В проверках native.js порт хоста обрывался намеренно. Без соединения
    // не уходят ack, а note() сообщает про виджет, а не про вкладки -
    // поэтому связь восстанавливаем.
    connectHost();
    window.__resolveHost();
    await tick();
    await tick();
    assert("tabs: связь с хостом восстановлена", host.connected === true);

    var VK_TABS = [
      { id: 1, url: "https://vk.com/music", status: "complete", title: "VK Музыка" },
      { id: 2, url: "https://vk.com/music-1_2", status: "complete", title: "Артист" },
      { id: 3, url: "https://vk.com/feed", status: "complete", title: "Новости" },
      { id: 4, url: "https://vk.com/music", status: "loading", title: "Грузится" },
      { id: 5, url: "https://example.com/music", status: "complete", title: "Чужой сайт" },
      { id: 6, url: "https://vk.com/feed", status: "complete", title: "Ещё новости" },
    ];
    window.__tabs = VK_TABS;
    window.__sendMessageImpl = function (tabId) {
      if (tabId === 1) {
        return Promise.resolve({ title: "Первый трек", artist: "Первый артист", playing: true, pos: 30, dur: 0, frac: 0.25, bands: [0.1, 0.2] });
      }
      if (tabId === 2) {
        return Promise.resolve({ title: "Второй трек", artist: "Второй артист", playing: false, pos: 0, dur: 200, durExact: true, frac: 0 });
      }
      return Promise.reject(new Error("нет получателя"));
    };

    await pollTabs();
    note("источников найдено: " + store.sources.size + ", готово: " + store.lastItems.length);

    assertEqual("tabs: найдены только вкладки VK Музыки",
      Array.from(store.sources.keys()).sort(), [1, 2]);
    assert("tabs: незагруженная вкладка пропущена", !store.sources.has(4));
    assert("tabs: чужой сайт пропущен", !store.sources.has(5));
    assertEqual("tabs: в источниках только ответившие", store.lastItems.length, 2);

    var first = store.lastItems.find(function (i) { return i.key === "tab:1"; });
    var second = store.lastItems.find(function (i) { return i.key === "tab:2"; });
    assert("tabs: название трека из вкладки", first && first.title === "Первый трек", JSON.stringify(first));
    assert("tabs: исполнитель из вкладки", first && first.artist === "Первый артист");
    assert("tabs: признак играет", first && first.playing === true);
    assertEqual("tabs: позиция", first && first.pos, 30);
    assertEqual("tabs: доля", first && first.frac, 0.25);
    assertEqual("tabs: полосы спектра обрезаны до 20", first && first.bands.length, 2);
    assertEqual("tabs: источник назван VK Музыка", first && first.app, "VK Музыка");
    assertEqual("tabs: длительность из вкладки", second && second.dur, 200);
    assertEqual("tabs: длительность из вкладки помечена точной", second && second.dur_exact, true);
    assertEqual("tabs: невзведённая длительность игнорируется", first && first.dur, 0);
    assert("tabs: ключ кэша содержит вкладку и трек",
      first && first.ck === "1|Первый трек|Первый артист", first && first.ck);

    assertEqual("tabs: автовыбор взял играющую вкладку", store.selectedKey, "tab:1");

    // Выбор пользователя переживает следующий опрос.
    window.__sendMessageImpl = function (tabId) {
      return Promise.resolve(tabId === 1
        ? { title: "Первый трек", artist: "Первый артист", playing: false, pos: 31, dur: 0, frac: 0.26 }
        : { title: "Второй трек", artist: "Второй артист", playing: true, pos: 5, dur: 200, frac: 0.02 });
    };
    store.selectedKey = "tab:2";
    store.userPicked = true;
    await pollTabs();
    assert("tabs: выбор пользователя удержан", store.selectedKey === "tab:2",
      "выбрано " + store.selectedKey +
      "; источники=" + JSON.stringify(Array.from(store.sources.keys())) +
      "; элементы=" + JSON.stringify(store.lastItems.map(function (i) { return i.key; })) +
      "; userPicked=" + store.userPicked);

    // Выбранная вкладка исчезла - автоподбор берёт играющую.
    window.__tabs = [VK_TABS[1]];
    await pollTabs();
    assertEqual("tabs: при исчезновении вкладки выбирается играющая", store.selectedKey, "tab:2");
    assertEqual("tabs: список источников сжался", store.lastItems.length, 1);

    // Ни одной вкладки VK Музыки.
    window.__tabs = [VK_TABS[2]];
    await pollTabs();
    assertEqual("tabs: без вкладок список пуст", store.lastItems.length, 0);
    assert("tabs: без вкладок причина ясна",
      note().indexOf("Откройте вкладку") >= 0, note());

    // Вкладки опрашиваются параллельно. Нужны ДВЕ медленные вкладки: при
    // последовательном обходе опрос занял бы 500 мс вместо 250 мс.
    window.__tabs = [VK_TABS[0], VK_TABS[1]];
    window.__sendMessageImpl = function (tabId) {
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve({
            title: tabId === 1 ? "Первая" : "Вторая",
            artist: "Вкладка", playing: false, pos: 0, dur: 0, frac: 0,
          });
        }, 250);
      });
    };
    var startedAt = Date.now();
    await pollTabs();
    var elapsed = Date.now() - startedAt;
    assert("page: вкладки опрашиваются параллельно", elapsed < 400,
      "опрос занял " + elapsed + " мс; по очереди было бы около 500");
    assertEqual("tabs: обе вкладки попали в список", store.lastItems.length, 2);

    window.__tabs = [];
    window.__sendMessageImpl = null;

    // --- art.js: обложки -----------------------------------------------------

    // Подменяем fetch расширения на загрузку настоящей картинки:
    // canvas -> Blob проходит через createImageBitmap без изменений,
    // поэтому проверяется весь путь целиком.
    async function makeArtBlob(width, height) {
      var c = document.createElement("canvas");
      c.width = width;
      c.height = height;
      var g = c.getContext("2d");
      g.fillStyle = "#7c5cff";
      g.fillRect(0, 0, width, height);
      return new Promise(function (resolve) { c.toBlob(resolve, "image/png"); });
    }

    var artRequests = [];
    window.__origFetch = window.fetch;
    window.fetch = function (url, opts) {
      artRequests.push(String(url));
      return Promise.resolve({
        ok: true,
        status: 200,
        blob: function () { return makeArtBlob(1000, 800); },
      });
    };

    store.sources = new Map([[1, { tabId: 1, url: "https://vk.com/music", ready: true,
      state: { title: "С обложкой", artist: "Артист", playing: true, pos: 1, dur: 0, frac: 0,
               coverUrl: "https://sun1-96.userapi.com/big.jpg" } }]]);
    window.__tabs = VK_TABS;
    window.__sendMessageImpl = function () {
      return Promise.resolve({ title: "С обложкой", artist: "Артист", playing: true, pos: 1,
        dur: 0, frac: 0, coverUrl: "https://sun1-96.userapi.com/big.jpg" });
    };

    await pollTabs();
    await updateArt();
    var withArt = store.lastItems[0];
    assert("page: обложка загрузилась", !!(withArt && withArt.art),
      "art=" + JSON.stringify(withArt && withArt.art) + " ошибка=" + artLastError);
    assert("page: обложка - чистый base64 без префикса",
      withArt.art.indexOf("data:") < 0, withArt.art.slice(0, 40));
    assert("page: обложка помечена как новая", withArt.art_new === true);
    assertEqual("page: запрос обложки ушёл по адресу из вкладки",
      artRequests[0], "https://sun1-96.userapi.com/big.jpg");

    // Повторный опрос берёт обложку из кэша и не качает заново.
    artRequests.length = 0;
    await pollTabs();
    await updateArt();
    assertEqual("page: повторный опрос не качает обложку заново", artRequests.length, 0);
    assertEqual("page: обложка из кэша не помечается новой", store.lastItems[0].art_new, false);
    assert("page: обложка из кэша на месте", store.lastItems[0].art === withArt.art);

    // Обложки нет - источник всё равно работает.
    window.__sendMessageImpl = function () {
      return Promise.resolve({ title: "Без обложки", artist: "Артист", playing: true, pos: 1, dur: 0, frac: 0 });
    };
    artRequests.length = 0;
    await pollTabs();
    await updateArt();
    assertEqual("page: без обложки источник остаётся в списке", store.lastItems.length, 2);
    assertEqual("page: без обложки пустое поле art", store.lastItems[0].art, "");
    assertEqual("page: без обложки ничего не качается", artRequests.length, 0);

    // Ошибка сети не должна ронять опрос.
    window.fetch = function () { return Promise.reject(new Error("сеть")); };
    window.__sendMessageImpl = function () {
      return Promise.resolve({ title: "Обрыв", artist: "Артист", playing: true, pos: 1, dur: 0, frac: 0,
        coverUrl: "https://sun1-96.userapi.com/missing.jpg" });
    };
    await pollTabs();
    await updateArt();
    assertEqual("page: после обрыва источник на месте", store.lastItems.length, 2);
    assertEqual("page: после обрыва обложка пустая", store.lastItems[0].art, "");

    window.fetch = window.__origFetch;

    // --- page.js: маршрутизация команд -------------------------------------

    window.__tabs = VK_TABS;
    window.__sendMessageImpl = function (tabId, msg) {
      return Promise.resolve({ ok: true, msg: tabId + ":" + msg.action });
    };
    await pollTabs();
    // Явно выбираем вторую вкладку: проверка ниже интересует именно
    // маршрутизацией, а не правилами автоподбора.
    store.selectedKey = "tab:2";
    store.userPicked = true;

    window.__sentToHost.length = 0;
    await host.onCommand({ action: "toggle", key: "tab:2", id: 11 });
    var sent = window.__sentToHost.find(function (m) { return m.t === "ack"; });
    assert("page: команда ушла в выбранную вкладку", !!sent && sent.ok === true, JSON.stringify(sent));
    var routed = window.__calls.filter(function (c) { return c.name === "tabs.sendMessage"; }).pop();
    assert("page: команда адресована tab:2", routed && routed.args[0] === 2, JSON.stringify(routed));
    assert("page: команда без доли не передаёт seek", routed && routed.args[1].ratio === null);

    // Команда без указания источника идёт в выбранный.
    await host.onCommand({ action: "next", id: 12 });
    routed = window.__calls.filter(function (c) { return c.name === "tabs.sendMessage"; }).pop();
    assert("page: команда без ключа идёт в выбранный источник", routed && routed.args[0] === 2,
      JSON.stringify(routed));

    // Перемотка передаёт долю.
    await host.onCommand({ action: "seek", key: "tab:1", ratio: 0.5, id: 13 });
    routed = window.__calls.filter(function (c) { return c.name === "tabs.sendMessage"; }).pop();
    assert("page: доля перемотки доходит до вкладки", routed && routed.args[1].ratio === 0.5);

    // Вкладка не отвечает - команда отклонена, фон не падает.
    window.__sendMessageImpl = function () { return Promise.reject(new Error("нет получателя")); };
    window.__sentToHost.length = 0;
    await host.onCommand({ action: "toggle", key: "tab:1", id: 14 });
    sent = window.__sentToHost.find(function (m) { return m.t === "ack"; });
    assert("page: отказ вкладки превращается в ack с ошибкой", !!sent && sent.ok === false,
      JSON.stringify(sent));

    // Указана вкладка, которой уже нет: команда уходит в выбранную,
    // потому что вкладка могла закрыться между опросом и нажатием.
    window.__sendMessageImpl = function () { return Promise.resolve({ ok: true }); };
    window.__calls.length = 0;
    await host.onCommand({ action: "toggle", key: "tab:999", id: 17 });
    routed = window.__calls.filter(function (c) { return c.name === "tabs.sendMessage"; }).pop();
    assert("page: исчезнувшая вкладка откатывается на выбранную",
      routed && routed.args[0] === 2, JSON.stringify(routed));

    // Совсем нет вкладок - команда честно отклоняется.
    window.__tabs = [];
    await pollTabs();
    window.__sentToHost.length = 0;
    await host.onCommand({ action: "toggle", key: "tab:1", id: 18 });
    sent = window.__sentToHost.find(function (m) { return m.t === "ack"; });
    assert("page: без вкладок команда отклоняется", !!sent && sent.ok === false,
      JSON.stringify(sent));

    // Выбор источника пользователем.
    window.__tabs = VK_TABS;
    window.__sendMessageImpl = function () { return Promise.resolve({ ok: true }); };
    await pollTabs();
    await host.onCommand({ action: "select", key: "tab:1", id: 15 });
    assertEqual("page: выбор источника запомнен", store.selectedKey, "tab:1");
    assertEqual("page: выбор помечен как ручной", store.userPicked, true);

    await host.onCommand({ action: "select", key: "tab:777", id: 16 });
    sent = window.__sentToHost.find(function (m) { return m.t === "ack" && m.id === 16; });
    assert("page: выбор несуществующего источника отклонён", !!sent && sent.ok === false,
      JSON.stringify(sent));
    assertEqual("page: неудачный выбор не сбивает текущий", store.selectedKey, "tab:1");

    // --- page.js: диагностика и снимок --------------------------------------

    assert("page: без вкладок виджету объяснено почему", note().length > 0);

    // Возвращаем соединение и проверяем снимок. Прежний промис connectNative
// уже отклонён, поэтому нужен новый вызов connectHost().
    window.__calls.length = 0;
    connectHost();
    window.__resolveHost();
    await tick();
    await tick();
    assert("page: соединение восстановлено", host.port !== null);

    window.__sentToHost.length = 0;
    sendState();
    var state = window.__lastState();
    assert("page: снимок уходит виджету", state !== null && state.t === "state",
      JSON.stringify(state));
    assert("page: в снимке есть выбранный источник", state !== null && "selected" in state);
    assert("page: в снимке есть диагностика", state !== null && typeof state.note === "string");

    done();
  } catch (e) {
    fail("набор background упал", e);
    doneError(e);
  }
})();
</script>
</body>
</html>
