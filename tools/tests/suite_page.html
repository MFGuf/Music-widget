<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Название — Исполнитель | VK Музыка</title>
</head>
<body>

<!--
  Набор проверок скрипта главного мира (extension/page/page.js) на
  разметке, похожей на VK Музыку. Разметка меняется, поэтому проверки
  бьют по тем селекторам и подписям, на которые опирается page.js.
-->
<script src="/tools/tests/suite_common.js"></script>

<script>
// Ставит mock-разметку плеера. Меняется между проверками.
window.__clicks = [];
window.__mockPlaying = false;

function mockPlayer(opts) {
  opts = opts || {};
  document.body.innerHTML = "";
  window.__clicks = [];
  if (opts.playing !== undefined) {
    window.__mockPlaying = !!opts.playing;
  }

  const player = document.createElement("div");
  player.className = "player";
  player.innerHTML = [
    '<div class="player__cover">' +
      (opts.noCover ? "" : '<img class="cover__img" src="https://sun1-96.userapi.com/caption.jpg?cover">') +
    '</div>',
    '<div class="track-name"><div class="track-name__title">' +
      (opts.title == null ? "Тестовый трек" : opts.title) +
    '</div><div class="track-name__art">' +
      (opts.artist == null ? "Тестовый артист" : opts.artist) +
    '</div></div>',
    '<div class="player__controls">',
    '  <button class="Icon Icon--prev" style="width:40px;height:40px" aria-label="Предыдущий трек"></button>',
    '  <button class="Icon Icon--play" id="mock-play" style="width:40px;height:40px" aria-label="' +
      (window.__mockPlaying ? "Пауза" : "Воспроизвести") + '"></button>',
    '  <button class="Icon Icon--next" style="width:40px;height:40px" aria-label="Следующий трек"></button>',
    '</div>',
  ].join("\n");
  document.body.appendChild(player);

  // Кнопки отвечают на клики: переключают подпись и пишут себя в журнал,
  // как настоящий плеер.
  for (const btn of player.querySelectorAll("button")) {
    btn.addEventListener("click", function () {
      window.__clicks.push(btn.getAttribute("aria-label"));
      if (btn.id === "mock-play") {
        window.__mockPlaying = !window.__mockPlaying;
        btn.setAttribute("aria-label", window.__mockPlaying ? "Пауза" : "Воспроизвести");
      }
    });
  }

  if (opts.media !== false) {
    const audio = document.createElement("audio");
    audio.id = "vk-audio";
    audio.src = "https://vk.com/track.mp3";
    document.body.appendChild(audio);
    if (opts.duration != null) {
      Object.defineProperty(audio, "duration", { value: opts.duration, configurable: true });
    }
    if (opts.position != null) {
      audio.currentTime = opts.position;
    }
    if (opts.paused != null) {
      Object.defineProperty(audio, "paused", { value: opts.paused, configurable: true });
    }
    return audio;
  }
  return null;
}

// Мок сети ставится ДО загрузки page.js: скрипт захватывает исходный
// fetch в момент загрузки, поэтому подмена после ни на что не влияет.
function makeFakeResponse(payload) {
  return {
    clone: function () {
      return { text: function () { return Promise.resolve(JSON.stringify(payload)); } };
    },
    text: function () { return Promise.resolve(JSON.stringify(payload)); },
  };
}

// Мок WebAudio ставится ДО page.js: скрипт подменяет методы прототипа
// AudioContext в момент загрузки.
window.__graph = [];
window.__createdAnalysers = [];
window.__createdNodes = [];
window.__spectrumPattern = null;

function FakeNode() { this.connected = []; }
FakeNode.prototype.connect = function (target) {
  this.connected.push(target);
  window.__graph.push([this, target]);
  return target;
};

function FakeAnalyser() {
  this.fftSize = 2048;
  this.smoothingTimeConstant = 0.8;
  this.frequencyBinCount = 64;
}
FakeAnalyser.prototype.getByteFrequencyData = function (data) {
  var pattern = window.__spectrumPattern;
  for (var i = 0; i < data.length; i++) {
    data[i] = pattern ? (pattern[i % pattern.length] | 0) : 0;
  }
};

function FakeAudioContext() {
  this.state = "running";
  this.destination = { __destination: true };
}
FakeAudioContext.prototype.createAnalyser = function () {
  var a = new FakeAnalyser();
  window.__createdAnalysers.push(a);
  return a;
};
FakeAudioContext.prototype.createMediaElementSource = function () {
  var n = new FakeNode();
  window.__createdNodes.push(n);
  return n;
};
FakeAudioContext.prototype.createMediaStreamSource = function () {
  var n = new FakeNode();
  window.__createdNodes.push(n);
  return n;
};
FakeAudioContext.prototype.createGain = function () { return new FakeNode(); };
FakeAudioContext.prototype.resume = function () { return Promise.resolve(); };

window.AudioContext = FakeAudioContext;
window.webkitAudioContext = FakeAudioContext;
window.__origAudioProtos = {
  source: FakeAudioContext.prototype.createMediaElementSource,
  analyser: FakeAudioContext.prototype.createAnalyser,
};

window.__origFetch = window.fetch;
window.__origXhrOpen = window.XMLHttpRequest.prototype.open;
window.__fetchCalls = [];
window.__fetchPayload = { response: { items: [] } };
window.__fetchBroken = false;
window.__responseConsumed = false;

window.fetch = function (input) {
  window.__fetchCalls.push(String(input && input.url ? input.url : input));
  if (window.__fetchBroken) {
    return Promise.reject(new Error("сеть недоступна"));
  }
  return Promise.resolve(makeFakeResponse(window.__fetchPayload));
};

// Обёртка: отправляет сообщение скрипту главного мира, как это делает
// content script, и ждёт ответ.
function ask(type, payload) {
  return new Promise(function (resolve) {
    var id = ask.nextId++;
    // Таймаут заведомо щедрый: стенд бывает запущен на загруженной машине,
    // и на 1000 мс проверки сыпались без всякой причины.
    var timer = setTimeout(function () { resolve(null); }, 3000);
    function onMessage(ev) {
      var d = ev.data;
      if (!d || d.__mw !== 1 || d.dir !== "toContent" || d.id !== id) {
        return;
      }
      clearTimeout(timer);
      window.removeEventListener("message", onMessage);
      resolve(d.payload);
    }
    window.addEventListener("message", onMessage);
    var msg = { __mw: 1, dir: "toPage", id: id, token: window.__token, t: type };
    if (payload) {
      msg.action = payload.action;
      msg.ratio = payload.ratio;
    }
    window.postMessage(msg, "*");
  });
}
ask.nextId = 5000;
</script>

<!-- Скрипт главного мира подключается первым делом, как и на реальной
     странице, где он внедряется на document_start. -->
<script>
window.__token = "тестовый-токен";
// Отвечаем на init раньше самого скрипта нельзя - init обрабатывает он сам.
</script>
<script src="/extension/page/page.js"></script>

<script>
"use strict";

// Скрипт ждёт init, чтобы узнать токен. Инициализируем его так же, как это
// делает content script.
(async function () {
  try {
    var ready = await ask("init", null);
    assert("page: скрипт главного мира отвечает на init", !!ready && ready.ready === true,
      JSON.stringify(ready));

    // Сообщения с чужим токеном игнорируются.
    var before = await ask("getState", null);
    assert("page: состояние читается", !!before && typeof before.title === "string",
      JSON.stringify(before));

    // --- разбор разметки VK Музыки ---------------------------------------

    mockPlayer({ title: "Кино", artist: "Дельфин" });
    var st = await ask("getState", null);
    assertEqual("page: название взято из track-name__title", st.title, "Кино");
    assertEqual("page: исполнитель взят из track-name__art", st.artist, "Дельфин");
    assertEqual("page: обложка взята из player__cover img", st.coverUrl,
      "https://sun1-96.userapi.com/caption.jpg?cover");
    assertEqual("page: адрес страницы", st.url, location.href);

    // Название, которого нет в DOM, берётся из заголовка вкладки.
    mockPlayer({ title: "", artist: "Кто-то" });
    st = await ask("getState", null);
    assertEqual("page: без названия в DOM берётся заголовок вкладки", st.title, "Название");

    // --- признак воспроизведения -----------------------------------------

    mockPlayer({ playing: true });
    st = await ask("getState", null);
    assertEqual("page: кнопка «Пауза» означает, что играет", st.playing, true);

    mockPlayer({ playing: false });
    st = await ask("getState", null);
    assertEqual("page: кнопка «Воспроизвести» означает паузу", st.playing, false);

    // Если кнопки нет, решение принимает медиаэлемент.
    document.body.innerHTML = '<div class="track-name"><div class="track-name__title">Без кнопки</div></div>';
    var audio = document.createElement("audio");
    audio.src = "https://vk.com/track.mp3";
    Object.defineProperty(audio, "paused", { value: false, configurable: true });
    Object.defineProperty(audio, "ended", { value: false, configurable: true });
    Object.defineProperty(audio, "readyState", { value: 4, configurable: true });
    document.body.appendChild(audio);
    st = await ask("getState", null);
    assertEqual("page: без кнопки состояние берётся из audio", st.playing, true);
    assertEqual("page: название без плеера тоже читается", st.title, "Без кнопки");

    // --- перехват play()/pause() ------------------------------------------

    mockPlayer({ media: false });
    var el = document.createElement("audio");
    el.src = "https://vk.com/x.mp3";
    document.body.appendChild(el);
    var seen = await ask("getState", null);
    assertEqual("page: без медиа пока не играет", seen.playing, false);

    await el.play().catch(function () {});
    seen = await ask("getState", null);
    assert("page: play() перехвачен", seen.hasMedia === true, JSON.stringify(seen));

    // --- защита от чужих сообщений -----------------------------------------

    var foreign = new Promise(function (resolve) {
      var timer = setTimeout(function () { resolve(null); }, 600);
      window.addEventListener("message", function on(ev) {
        var d = ev.data;
        if (d && d.__mw === 1 && d.dir === "toContent" && d.id === 4242) {
          clearTimeout(timer);
          window.removeEventListener("message", on);
          resolve(d);
        }
      });
    });
    // Тот же запрос, но с чужим токеном.
    window.postMessage({ __mw: 1, dir: "toPage", id: 4242, token: "чужой", t: "getState" }, "*");
    var leaked = await foreign;
    assert("page: сообщение с чужим токеном не получает ответа", leaked === null,
      JSON.stringify(leaked));

    // --- позиция и длительность ------------------------------------------------

    // Медиаэлемент с известной длительностью - самый точный источник.
    var a1 = mockPlayer({ position: 90, duration: 245, playing: true });
    st = await ask("getState", null);
    assertEqual("page: позиция взята из currentTime", st.pos, 90);
    assertEqual("page: длительность взята из media.duration", st.dur, 245);
    assertEqual("page: длительность помечена точной", st.durExact, true);
    assert("page: доля посчитана от длительности",
      Math.abs(st.frac - 90 / 245) < 0.01, "доля " + st.frac);

    // currentTime всегда задаётся от 0 и не превышает duration.
    a1.currentTime = 245;
    st = await ask("getState", null);
    assertEqual("page: позиция в конце трека", st.pos, 245);
    assert("page: доля не больше единицы", st.frac <= 1, "доля " + st.frac);

    a1.currentTime = 300;
    st = await ask("getState", null);
    assertEqual("page: currentTime больше длительности не ломает долю", st.frac, 1);

    // Длительности нет (поток без метаданных) - точной её не считаем.
    var a2 = mockPlayer({ position: 42, duration: 0, playing: true });
    st = await ask("getState", null);
    assertEqual("page: без длительности доля не выдумывается", st.frac, 0);
    assertEqual("page: без длительности она не точна", st.durExact, false);

// Перемотка сразу видна в состоянии: currentTime читается напрямую.
// У этого плеера длительности нет, поэтому доля остаётся нулевой.
a2.currentTime = 100;
st = await ask("getState", null);
assertEqual("page: перемотка видна сразу", st.pos, 100);
assertEqual("page: без длительности доля не выдумывается", st.frac, 0);

    // Без медиаэлемента позиция считается по ползунку и реальным часам.
    document.body.innerHTML =
      '<div class="track-name"><div class="track-name__title">Трек с ползунком</div></div>' +
      '<div role="slider" aria-label="позиция воспроизведения" aria-valuenow="25" ' +
      'style="width:300px;height:4px"></div>';
    st = await ask("getState", null);
    assert("page: без audio доля берётся из ползунка",
      st.frac > 0.2 && st.frac < 0.3, "доля " + st.frac);
    assertEqual("page: без audio длительность неизвестна", st.dur, 0);
    assertEqual("page: без audio прошедшее время не выдумывается", st.pos, 0);

    // Ползунок в процентах (0..100) приводится к доле.
    document.querySelector("[role='slider']").setAttribute("aria-valuenow", "75");
    st = await ask("getState", null);
    assert("page: ползунок в процентах переведён в долю",
      st.frac > 0.7 && st.frac < 0.8, "доля " + st.frac);

    // Прошедшее время растёт по реальным часам, а не по опросам.
    document.querySelector("[role='slider']").setAttribute("aria-valuenow", "30");
    await ask("getState", null);
    await new Promise(function (r) { setTimeout(r, 350); });
    var later = await ask("getState", null);
    assert("page: прошедшее время идёт по часам",
      later.pos > 0.1, "прошло " + later.pos);

    // Ползунок на 1.0 при остановке - это простой, а не конец трека.
    // Раньше в наборе был вызван play(), поэтому возвращаем плеер в паузу:
    // без этого состояние "играет" ещё держится и ползунок на 100% считается
    // концом трека.
    // play() возвращает промис, а pause() - нет.
    el.pause();
    document.querySelector("[role='slider']").setAttribute("aria-valuenow", "100");
    st = await ask("getState", null);
    assertEqual("page: ползунок на 100% при паузе обнуляется", st.frac, 0);
    assertEqual("page: после паузы playing снимается", st.playing, false);

    // Узкие элементы управления (громкость) ползунком позиции не считаются.
    document.body.innerHTML =
      '<div class="track-name"><div class="track-name__title">Только громкость</div></div>' +
      '<div role="slider" aria-label="громкость" aria-valuenow="50" ' +
      'style="width:24px;height:24px"></div>';
    st = await ask("getState", null);
    assertEqual("page: узкий слайдер громкости проигнорирован", st.frac, 0);

    // --- перехват ответов VK API ------------------------------------------------

// VK вызывает перехваченный fetch, а не исходный: проверяем именно хук.
var hooked = window.fetch;
assert("page: fetch перехвачен", hooked !== window.__origFetch);
assert("page: XHR.open перехвачен",
  window.XMLHttpRequest.prototype.open !== window.__origXhrOpen);

function apiCall(url, payload, body) {
  window.__fetchPayload = payload || { response: { items: [] } };
  window.__fetchCalls.length = 0;
  return window.fetch(url, body ? { method: "POST", body: body } : undefined)
    .then(function () {
      return new Promise(function (r) { setTimeout(r, 30); });
    });
}

var apiPayload = {
  response: {
    items: [
      { id: 1, title: "Кино", artist: "Дельфин", duration: 245,
        thumb_src: "https://sun1-96.userapi.com/c1.jpg" },
      { id: 2, title: "Без обложки", artist: "Кто-то", duration: 180 },
    ],
  },
};

await apiCall("https://api.vk.com/method/audio.get?act=one", apiPayload);
assertEqual("page: запрос к VK API дошёл до страницы", window.__fetchCalls.length, 1);

mockPlayer({ title: "Кино", artist: "Дельфин", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: длительность взята из ответа API", st.dur, 245);
assertEqual("page: длительность из API помечена точной", st.durExact, true);

// Без обложки в DOM её берём из ответа API.
mockPlayer({ title: "Кино", artist: "Дельфин", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: обложка из API используется, если в DOM её нет", st.coverUrl,
  "https://sun1-96.userapi.com/c1.jpg");

// Обложка из DOM важнее: она точно соответствует тому, что на экране.
mockPlayer({ title: "Кино", artist: "Дельфин", media: false });
st = await ask("getState", null);
assert("page: обложка из DOM приоритетнее",
  st.coverUrl.indexOf("caption.jpg") > 0, st.coverUrl);

// Тот же ответ по не-API адресу ничего не даёт.
await apiCall("https://api.vk.com/method/audio.get", { response: { items: [] } });
mockPlayer({ title: "Кино", artist: "Дельфин", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: пустой ответ не стирает ранее узнанный трек", st.dur, 245);
assertEqual("page: обложка из API переживает пустой ответ", st.coverUrl,
  "https://sun1-96.userapi.com/c1.jpg");

// Ответ без "duration" разбирается вхолостую и ничего не портит.
await apiCall("https://api.vk.com/method/friends.get", { response: { count: 5 } });
mockPlayer({ title: "Нет данных", artist: "Никто", media: false });
st = await ask("getState", null);
assertEqual("page: неизвестный трек остаётся без длительности", st.dur, 0);
assertEqual("page: неизвестный трек не считается точным", st.durExact, false);

// --- Текущий трек по данным API -------------------------------------------------
//
// Проверяем ровно ту поломку, что видел пользователь: на странице плейлиста
// селекторы названия попадают в заголовок раздела, и виджет показывал
// «Моя музыка» с длительностью всего плейлиста. Ответ API должен побеждать.

// Сначала ответ про список треков - текущим он не считается: в плейлисте их
// десятки, и последний из них может быть совсем не тем, что звучит.
await apiCall("https://api.vk.com/method/audio.get", {
  response: {
    items: [
      { title: "Первый в списке", artist: "Кто-то", duration: 111,
        thumb_src: "https://sun1-96.userapi.com/list.jpg" },
      { title: "Просто в списке", artist: "Кто-то", duration: 222 },
    ],
  },
});
mockPlayer({ title: "Моя музыка", artist: "", media: false, noCover: true });
st = await ask("getState", null);
assert("page: ответ со списком треков не становится текущим",
  st.title !== "Просто в списке", st.title);

// Теперь ответ про один конкретный трек - это и есть играющее.
await apiCall("https://api.vk.com/method/audio.get", {
  response: {
    title: "Переимен", artist: "Кино", duration: 245,
    thumb_src: "https://sun1-96.userapi.com/track.jpg",
  },
});
mockPlayer({ title: "Моя музыка", artist: "", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: название берётся из API, а не из заголовка раздела",
  st.title, "Переимен");
assertEqual("page: исполнитель берётся из API", st.artist, "Кино");
assertEqual("page: длительность играющего трека из API", st.dur, 245);
assertEqual("page: длительность помечена точной", st.durExact, true);
assertEqual("page: обложка играющего трека из API", st.coverUrl,
  "https://sun1-96.userapi.com/track.jpg");

// Ответ плейлиста после одиночного трека не должен перебивать его: если бы
// перебивал, длинный плейлист снова превратился бы в «текущий трек».
await apiCall("https://api.vk.com/method/audio.get", {
  response: {
    items: [{ title: "Другая песня", artist: "Оркестр", duration: 3600 }],
  },
});
mockPlayer({ title: "Моя музыка", artist: "", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: список треков не вытесняет текущий трек", st.title, "Переимен");
assertEqual("page: длительность не сбилась на длину плейлиста", st.dur, 245);

// Ответ с ОДНИМ треком узнаётся по форме, даже если метода в адресе нет:
// VK ходит через execute с act=..., и имя audio.get там не встречается.
await apiCall("https://api.vk.com/method/execute", {
  response: {
    title: "По форме", artist: "Оркестр", duration: 199,
    thumb_src: "https://sun1-96.userapi.com/shape.jpg",
  },
}, "act=do_play");
mockPlayer({ title: "Моя музыка", artist: "", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: одиночный ответ узнан по форме, без имени метода",
  st.title, "По форме");
assertEqual("page: обложка одиночного ответа", st.coverUrl,
  "https://sun1-96.userapi.com/shape.jpg");

// Плеер VK держит звук ВНЕ страницы: new Audio() без appendChild.
// Наш хук play() видит такой элемент, а поиск по странице - нет.
// Проверяем именно этот случай: элемента в документе нет вовсе.
mockPlayer({ title: "Переимен", artist: "Кино", media: false });

var outside = document.createElement("audio");
outside.src = "https://vk.com/track.mp3";
Object.defineProperty(outside, "duration", { value: 275, configurable: true });
Object.defineProperty(outside, "paused", { value: false, configurable: true });
Object.defineProperty(outside, "readyState", { value: 4, configurable: true });
// Вызываем play() так, чтобы сработал НАШ хук: он и должен увидеть
// элемент. Подменять метод поверх хука нельзя - тогда мы проверим не то.
window.HTMLMediaElement.prototype.play.call(outside);
await new Promise(function (r) { setTimeout(r, 20); });

var hooked = await ask("getState", null);

// Диагностика: тот же отбор, что делает page.js, но прямо здесь.
// Заодно страхует от возврата бага с \w: в JavaScript он не покрывает
// кириллицу, и «следующ\w*» перестал бы находить «Следующий трек».
var DIAG_SELECTOR = 'button,[role="button"],[data-test-id],[class*="Icon"],[class*="Tappable"]';
var DIAG_NEXT = /(^|[\s_-])(next|следующ[а-яё]*|впер[её]д|вперед)([\s_-]|$)/i;
var DIAG_PREV = /(^|[\s_-])(prev|previous|предыдущ[а-яё]*|предыд[а-яё]*|назад)([\s_-]|$)/i;
var DIAG_BAD = /shuffle|shuf|repeat|volume|mute|like|favou?rite|share|download|queue|playlist|lyric|expand|more|setting|quality|comment|sponsor|add|remove|delete|open|fullscreen|cast|pip|scroll|carousel|arrow|swiper|slider|dots|navigation/i;
var diagLabel = document.getElementById("btn-next").getAttribute("aria-label");
assertEqual("page: диагностика - кнопки найдены",
  document.querySelectorAll(DIAG_SELECTOR).length, 3);
assert("page: диагностика - RE_NEXT ловит кириллицу", DIAG_NEXT.test(diagLabel),
  JSON.stringify(diagLabel));
assert("page: диагностика - лишние слова отсеиваются", !DIAG_BAD.test(diagLabel),
  JSON.stringify(diagLabel));

mid[20] = 200;

  window.__clicks.join(",") === "prev",
  "клики: " + window.__clicks.join(",") + " ответ: " + JSON.stringify(res));

document.body.innerHTML = "";
//
// В плейлисте на 109 песен длительности иногда совпадают - ремиксы, записи
// концерта. Одной длительности мало, и виджет показывал чужое название.
// Различать их должна обложка: у каждой песни она своя.

await apiCall("https://api.vk.com/method/audio.get", {
  response: {
    items: [
      { id: 201, title: "Студийная версия", artist: "Группа", duration: 245,
        thumb_src: "https://sun1-96.userapi.com/Zz11Zz/w100.jpg" },
      { id: 202, title: "Концертная версия", artist: "Группа", duration: 245,
        thumb_src: "https://sun1-96.userapi.com/Qq22Qq/w300.jpg" },
    ],
  },
});
window.__musicWidgetApiState.current = null;
document.body.innerHTML = [
  '<h1>Моя музыка</h1>',
  '<div class="player-bar" style="width:600px">',
  '  <img class="player-bar__cover"',
  '    src="https://sun1-96.userapi.com/Qq22Qq/w300.jpg">',
  '  <div class="track-name">',
  '    <div class="track-name__title">Концертная версия</div>',
  '  </div>',
  '  <button class="Icon Icon--play" style="width:40px;height:40px"',
  '    aria-label="Пауза"></button>',
  '</div>',
].join("\n");

// Звук с той же длительностью, что у обеих песен.
var twin = document.createElement("audio");
twin.src = "https://vk.com/track.mp3";
Object.defineProperty(twin, "duration", { value: 245, configurable: true });
Object.defineProperty(twin, "paused", { value: false, configurable: true });
Object.defineProperty(twin, "readyState", { value: 4, configurable: true });
window.HTMLMediaElement.prototype.play.call(twin);
await new Promise(function (r) { setTimeout(r, 20); });

var twinState = await ask("getState", null);
assertEqual("page: при одинаковой длительности решает обложка",
  twinState.title, "Концертная версия");
assertEqual("page: обложка совпавшей песни", twinState.coverUrl,
  "https://sun1-96.userapi.com/Qq22Qq/w300.jpg");
assert("page: в диагностике видно, чем опознан трек",
  twinState.diag && twinState.diag.matchedBy === "обложка",
  JSON.stringify(twinState.diag));

// Обложка в панели может быть отдана другого размера, чем в API:
// узнать её надо по части пути, а не по адресу целиком.
window.__musicWidgetApiState.current = null;
document.querySelector(".player-bar img").src =
  "https://sun1-96.userapi.com/Qq22Qq/w600.jpg";
var resized = await ask("getState", null);
assertEqual("page: обложка другого размера - та же песня", resized.title,
  "Концертная версия");

Object.defineProperty(twin, "ended", { value: true, configurable: true });
document.body.innerHTML = "";
//
// На паузе звук пропадает: медиаэлемента нет и опознать трек нечем. Но
// виджет не должен откатываться на заголовок раздела - песня-то та же.
// Помним опознанный трек и держим его.
//
// Блок стоит последним намеренно: он оставляет запомненный звук, и любые
// проверки после него смотрели бы не на свои данные.
window.__musicWidgetApiState.current = null;
window.__musicWidgetApiState.meta.clear();
window.__musicWidgetApiState.resolved = null;
document.body.innerHTML = [
  '<h1>Моя музыка</h1>',
  '<div class="player-bar" style="width:600px">',
  '  <img class="player-bar__cover" src="https://sun1-96.userapi.com/now.jpg">',
  '  <div class="track-name">',
  '    <div class="track-name__title">Реальная песня</div>',
  '    <div class="track-name__artist">Тот самый исполнитель</div>',
  '  </div>',
  '  <button class="Icon Icon--play" style="width:40px;height:40px"',
  '    aria-label="Пауза"></button>',
  '</div>',
].join("\n");

// Звук, как у VK, живёт вне страницы.
var pausedSound = document.createElement("audio");
pausedSound.src = "https://vk.com/track.mp3";
Object.defineProperty(pausedSound, "duration", { value: 275, configurable: true });
Object.defineProperty(pausedSound, "paused", { value: false, configurable: true });
Object.defineProperty(pausedSound, "readyState", { value: 4, configurable: true });
window.HTMLMediaElement.prototype.play.call(pausedSound);
await new Promise(function (r) { setTimeout(r, 20); });

var playingNow = await ask("getState", null);
assertEqual("page: до паузы песня известна", playingNow.title, "Реальная песня");

Object.defineProperty(pausedSound, "paused", { value: true, configurable: true });
document.querySelector(".player-bar button")
  .setAttribute("aria-label", "Воспроизвести");
var onPause = await ask("getState", null);
assertEqual("page: на паузе название остаётся прежним", onPause.title, "Реальная песня");
assertEqual("page: на паузе исполнитель остаётся прежним", onPause.artist,
  "Тот самый исполнитель");
assertEqual("page: на паузе обложка остаётся прежней", onPause.coverUrl,
  "https://sun1-96.userapi.com/now.jpg");

// Возвращаем кэш в прежнее состояние: следующие проверки опираются на него.
// Обнулять его было нужно здесь, чтобы доказать, что трек найден без API.
await apiCall("https://api.vk.com/method/audio.get", {
  response: {
    items: [
      { title: "Кино", artist: "Дельфин", duration: 245,
        thumb_src: "https://sun1-96.userapi.com/c1.jpg" },
    ],
  },
});
document.body.innerHTML = "";

// Вложенный ответ execute.multiple разбирается так же.
await apiCall("https://api.vk.com/method/execute.multiple", {
  response: {
    "audio.get": { response: { items: [
      { title: "Вложенный", artist: "Группа", duration: 301 },
    ] } },
  },
});
mockPlayer({ title: "Вложенный", artist: "Группа", media: false });
st = await ask("getState", null);
assertEqual("page: вложенный ответ execute.multiple разобран", st.dur, 301);

// Провал запроса не должен ломать страницу.
window.__fetchBroken = true;
var rejected = false;
try {
  await window.fetch("https://api.vk.com/method/audio.get");
} catch (e) {
  rejected = true;
}
window.__fetchBroken = false;
assert("page: ошибка сети доходит до вызывающего", rejected === true);
mockPlayer({ title: "Кино", artist: "Дельфин", media: false });
st = await ask("getState", null);
assert("page: после ошибки скрипт продолжает работать", !!st && typeof st.title === "string");


    done();
  } catch (e) {
    fail("набор page упал", e);
    doneError(e);
  }
})();
