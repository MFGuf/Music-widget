<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Название — Исполнитель | VK Музыка</title>
</head>
<body>

<!--
  Набор проверок скрипта главного мира (extension/page/page.js) на
  разметке, похожей на VK Музыку. Разметка меняется, поэтому проверки
  бьют по тем селекторам и подписям, на которые опирается page.js.
-->
<script src="/tools/tests/suite_common.js"></script>

<script>
// Ставит mock-разметку плеера. Меняется между проверками.
window.__clicks = [];
window.__mockPlaying = false;

function mockPlayer(opts) {
  opts = opts || {};
  document.body.innerHTML = "";
  window.__clicks = [];
  if (opts.playing !== undefined) {
    window.__mockPlaying = !!opts.playing;
  }

  const player = document.createElement("div");
  player.className = "player";
  player.innerHTML = [
    '<div class="player__cover">' +
      (opts.noCover ? "" : '<img class="cover__img" src="https://sun1-96.userapi.com/caption.jpg?cover">') +
    '</div>',
    '<div class="track-name"><div class="track-name__title">' +
      (opts.title == null ? "Тестовый трек" : opts.title) +
    '</div><div class="track-name__art">' +
      (opts.artist == null ? "Тестовый артист" : opts.artist) +
    '</div></div>',
    '<div class="player__controls">',
    '  <button class="Icon Icon--prev" style="width:40px;height:40px" aria-label="Предыдущий трек"></button>',
    '  <button class="Icon Icon--play" id="mock-play" style="width:40px;height:40px" aria-label="' +
      (window.__mockPlaying ? "Пауза" : "Воспроизвести") + '"></button>',
    '  <button class="Icon Icon--next" style="width:40px;height:40px" aria-label="Следующий трек"></button>',
    '</div>',
  ].join("\n");
  document.body.appendChild(player);

  // Кнопки отвечают на клики: переключают подпись и пишут себя в журнал,
  // как настоящий плеер.
  for (const btn of player.querySelectorAll("button")) {
    btn.addEventListener("click", function () {
      window.__clicks.push(btn.getAttribute("aria-label"));
      if (btn.id === "mock-play") {
        window.__mockPlaying = !window.__mockPlaying;
        btn.setAttribute("aria-label", window.__mockPlaying ? "Пауза" : "Воспроизвести");
      }
    });
  }

  if (opts.media !== false) {
    const audio = document.createElement("audio");
    audio.id = "vk-audio";
    audio.src = "https://vk.com/track.mp3";
    document.body.appendChild(audio);
    if (opts.duration != null) {
      Object.defineProperty(audio, "duration", { value: opts.duration, configurable: true });
    }
    if (opts.position != null) {
      audio.currentTime = opts.position;
    }
    if (opts.paused != null) {
      Object.defineProperty(audio, "paused", { value: opts.paused, configurable: true });
    }
    return audio;
  }
  return null;
}

// Мок сети ставится ДО загрузки page.js: скрипт захватывает исходный
// fetch в момент загрузки, поэтому подмена после ни на что не влияет.
function makeFakeResponse(payload) {
  return {
    clone: function () {
      return { text: function () { return Promise.resolve(JSON.stringify(payload)); } };
    },
    text: function () { return Promise.resolve(JSON.stringify(payload)); },
  };
}

window.__origFetch = window.fetch;
window.__origXhrOpen = window.XMLHttpRequest.prototype.open;
window.__fetchCalls = [];
window.__fetchPayload = { response: { items: [] } };
window.__fetchBroken = false;
window.__responseConsumed = false;

window.fetch = function (input) {
  window.__fetchCalls.push(String(input && input.url ? input.url : input));
  if (window.__fetchBroken) {
    return Promise.reject(new Error("сеть недоступна"));
  }
  return Promise.resolve(makeFakeResponse(window.__fetchPayload));
};

// Обёртка: отправляет сообщение скрипту главного мира, как это делает
// content script, и ждёт ответ.
function ask(type, payload) {
  return new Promise(function (resolve) {
    var id = ask.nextId++;
    var timer = setTimeout(function () { resolve(null); }, 1000);
    function onMessage(ev) {
      var d = ev.data;
      if (!d || d.__mw !== 1 || d.dir !== "toContent" || d.id !== id) {
        return;
      }
      clearTimeout(timer);
      window.removeEventListener("message", onMessage);
      resolve(d.payload);
    }
    window.addEventListener("message", onMessage);
    var msg = { __mw: 1, dir: "toPage", id: id, token: window.__token, t: type };
    if (payload) {
      msg.action = payload.action;
      msg.ratio = payload.ratio;
    }
    window.postMessage(msg, "*");
  });
}
ask.nextId = 5000;
</script>

<!-- Скрипт главного мира подключается первым делом, как и на реальной
     странице, где он внедряется на document_start. -->
<script>
window.__token = "тестовый-токен";
// Отвечаем на init раньше самого скрипта нельзя - init обрабатывает он сам.
</script>
<script src="/extension/page/page.js"></script>

<script>
"use strict";

// Скрипт ждёт init, чтобы узнать токен. Инициализируем его так же, как это
// делает content script.
(async function () {
  try {
    var ready = await ask("init", null);
    assert("page: скрипт главного мира отвечает на init", !!ready && ready.ready === true,
      JSON.stringify(ready));

    // Сообщения с чужим токеном игнорируются.
    var before = await ask("getState", null);
    assert("page: состояние читается", !!before && typeof before.title === "string",
      JSON.stringify(before));

    // --- разбор разметки VK Музыки ---------------------------------------

    mockPlayer({ title: "Кино", artist: "Дельфин" });
    var st = await ask("getState", null);
    assertEqual("page: название взято из track-name__title", st.title, "Кино");
    assertEqual("page: исполнитель взят из track-name__art", st.artist, "Дельфин");
    assertEqual("page: обложка взята из player__cover img", st.coverUrl,
      "https://sun1-96.userapi.com/caption.jpg?cover");
    assertEqual("page: адрес страницы", st.url, location.href);

    // Название, которого нет в DOM, берётся из заголовка вкладки.
    mockPlayer({ title: "", artist: "Кто-то" });
    st = await ask("getState", null);
    assertEqual("page: без названия в DOM берётся заголовок вкладки", st.title, "Название");

    // --- признак воспроизведения -----------------------------------------

    mockPlayer({ playing: true });
    st = await ask("getState", null);
    assertEqual("page: кнопка «Пауза» означает, что играет", st.playing, true);

    mockPlayer({ playing: false });
    st = await ask("getState", null);
    assertEqual("page: кнопка «Воспроизвести» означает паузу", st.playing, false);

    // Если кнопки нет, решение принимает медиаэлемент.
    document.body.innerHTML = '<div class="track-name"><div class="track-name__title">Без кнопки</div></div>';
    var audio = document.createElement("audio");
    audio.src = "https://vk.com/track.mp3";
    Object.defineProperty(audio, "paused", { value: false, configurable: true });
    Object.defineProperty(audio, "ended", { value: false, configurable: true });
    Object.defineProperty(audio, "readyState", { value: 4, configurable: true });
    document.body.appendChild(audio);
    st = await ask("getState", null);
    assertEqual("page: без кнопки состояние берётся из audio", st.playing, true);
    assertEqual("page: название без плеера тоже читается", st.title, "Без кнопки");

    // --- перехват play()/pause() ------------------------------------------

    mockPlayer({ media: false });
    var el = document.createElement("audio");
    el.src = "https://vk.com/x.mp3";
    document.body.appendChild(el);
    var seen = await ask("getState", null);
    assertEqual("page: без медиа пока не играет", seen.playing, false);

    await el.play().catch(function () {});
    seen = await ask("getState", null);
    assert("page: play() перехвачен", seen.hasMedia === true, JSON.stringify(seen));

    // --- защита от чужих сообщений -----------------------------------------

    var foreign = new Promise(function (resolve) {
      var timer = setTimeout(function () { resolve(null); }, 600);
      window.addEventListener("message", function on(ev) {
        var d = ev.data;
        if (d && d.__mw === 1 && d.dir === "toContent" && d.id === 4242) {
          clearTimeout(timer);
          window.removeEventListener("message", on);
          resolve(d);
        }
      });
    });
    // Тот же запрос, но с чужим токеном.
    window.postMessage({ __mw: 1, dir: "toPage", id: 4242, token: "чужой", t: "getState" }, "*");
    var leaked = await foreign;
    assert("page: сообщение с чужим токеном не получает ответа", leaked === null,
      JSON.stringify(leaked));

    // --- позиция и длительность ------------------------------------------------

    // Медиаэлемент с известной длительностью - самый точный источник.
    var a1 = mockPlayer({ position: 90, duration: 245, playing: true });
    st = await ask("getState", null);
    assertEqual("page: позиция взята из currentTime", st.pos, 90);
    assertEqual("page: длительность взята из media.duration", st.dur, 245);
    assertEqual("page: длительность помечена точной", st.durExact, true);
    assert("page: доля посчитана от длительности",
      Math.abs(st.frac - 90 / 245) < 0.01, "доля " + st.frac);

    // currentTime всегда задаётся от 0 и не превышает duration.
    a1.currentTime = 245;
    st = await ask("getState", null);
    assertEqual("page: позиция в конце трека", st.pos, 245);
    assert("page: доля не больше единицы", st.frac <= 1, "доля " + st.frac);

    a1.currentTime = 300;
    st = await ask("getState", null);
    assertEqual("page: currentTime больше длительности не ломает долю", st.frac, 1);

    // Длительности нет (поток без метаданных) - точной её не считаем.
    var a2 = mockPlayer({ position: 42, duration: 0, playing: true });
    st = await ask("getState", null);
    assertEqual("page: без длительности доля не выдумывается", st.frac, 0);
    assertEqual("page: без длительности она не точна", st.durExact, false);

    // Перемотка через сеттер currentTime запоминается.
    a2.currentTime = 100;
    st = await ask("getState", null);
    assertEqual("page: перемотка видна сразу", st.pos, 100);
    assertEqual("page: перемотка запомнена как подсказка", st.seekHint, 100);

    // Без медиаэлемента позиция считается по ползунку и реальным часам.
    document.body.innerHTML =
      '<div class="track-name"><div class="track-name__title">Трек с ползунком</div></div>' +
      '<div role="slider" aria-label="позиция воспроизведения" aria-valuenow="25" ' +
      'style="width:300px;height:4px"></div>';
    st = await ask("getState", null);
    assert("page: без audio доля берётся из ползунка",
      st.frac > 0.2 && st.frac < 0.3, "доля " + st.frac);
    assertEqual("page: без audio длительность неизвестна", st.dur, 0);
    assertEqual("page: без audio прошедшее время не выдумывается", st.pos, 0);

    // Ползунок в процентах (0..100) приводится к доле.
    document.querySelector("[role='slider']").setAttribute("aria-valuenow", "75");
    st = await ask("getState", null);
    assert("page: ползунок в процентах переведён в долю",
      st.frac > 0.7 && st.frac < 0.8, "доля " + st.frac);

    // Прошедшее время растёт по реальным часам, а не по опросам.
    document.querySelector("[role='slider']").setAttribute("aria-valuenow", "30");
    await ask("getState", null);
    await new Promise(function (r) { setTimeout(r, 350); });
    var later = await ask("getState", null);
    assert("page: прошедшее время идёт по часам",
      later.pos > 0.1, "прошло " + later.pos);

    // Ползунок на 1.0 при остановке - это простой, а не конец трека.
    // Раньше в наборе был вызван play(), поэтому возвращаем плеер в паузу:
    // без этого состояние "играет" ещё держится и ползунок на 100% считается
    // концом трека.
    // play() возвращает промис, а pause() - нет.
    el.pause();
    document.querySelector("[role='slider']").setAttribute("aria-valuenow", "100");
    st = await ask("getState", null);
    assertEqual("page: ползунок на 100% при паузе обнуляется", st.frac, 0);
    assertEqual("page: после паузы playing снимается", st.playing, false);

    // Узкие элементы управления (громкость) ползунком позиции не считаются.
    document.body.innerHTML =
      '<div class="track-name"><div class="track-name__title">Только громкость</div></div>' +
      '<div role="slider" aria-label="громкость" aria-valuenow="50" ' +
      'style="width:24px;height:24px"></div>';
    st = await ask("getState", null);
    assertEqual("page: узкий слайдер громкости проигнорирован", st.frac, 0);

    // --- перехват ответов VK API ------------------------------------------------

// VK вызывает перехваченный fetch, а не исходный: проверяем именно хук.
var hooked = window.fetch;
assert("page: fetch перехвачен", hooked !== window.__origFetch);
assert("page: XHR.open перехвачен",
  window.XMLHttpRequest.prototype.open !== window.__origXhrOpen);

function apiCall(url, payload) {
  window.__fetchPayload = payload || { response: { items: [] } };
  window.__fetchCalls.length = 0;
  return window.fetch(url).then(function () {
    return new Promise(function (r) { setTimeout(r, 30); });
  });
}

var apiPayload = {
  response: {
    items: [
      { id: 1, title: "Кино", artist: "Дельфин", duration: 245,
        thumb_src: "https://sun1-96.userapi.com/c1.jpg" },
      { id: 2, title: "Без обложки", artist: "Кто-то", duration: 180 },
    ],
  },
};

await apiCall("https://api.vk.com/method/audio.get?act=one", apiPayload);
assertEqual("page: запрос к VK API дошёл до страницы", window.__fetchCalls.length, 1);

mockPlayer({ title: "Кино", artist: "Дельфин", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: длительность взята из ответа API", st.dur, 245);
assertEqual("page: длительность из API помечена точной", st.durExact, true);

// Без обложки в DOM её берём из ответа API.
mockPlayer({ title: "Кино", artist: "Дельфин", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: обложка из API используется, если в DOM её нет", st.coverUrl,
  "https://sun1-96.userapi.com/c1.jpg");

// Обложка из DOM важнее: она точно соответствует тому, что на экране.
mockPlayer({ title: "Кино", artist: "Дельфин", media: false });
st = await ask("getState", null);
assert("page: обложка из DOM приоритетнее",
  st.coverUrl.indexOf("caption.jpg") > 0, st.coverUrl);

// Тот же ответ по не-API адресу ничего не даёт.
await apiCall("https://api.vk.com/method/audio.get", { response: { items: [] } });
mockPlayer({ title: "Кино", artist: "Дельфин", media: false, noCover: true });
st = await ask("getState", null);
assertEqual("page: пустой ответ не стирает ранее узнанный трек", st.dur, 245);
assertEqual("page: обложка из API переживает пустой ответ", st.coverUrl,
  "https://sun1-96.userapi.com/c1.jpg");

// Ответ без "duration" разбирается вхолостую и ничего не портит.
await apiCall("https://api.vk.com/method/friends.get", { response: { count: 5 } });
mockPlayer({ title: "Нет данных", artist: "Никто", media: false });
st = await ask("getState", null);
assertEqual("page: неизвестный трек остаётся без длительности", st.dur, 0);
assertEqual("page: неизвестный трек не считается точным", st.durExact, false);

// Вложенный ответ execute.multiple разбирается так же.
await apiCall("https://api.vk.com/method/execute.multiple", {
  response: {
    "audio.get": { response: { items: [
      { title: "Вложенный", artist: "Группа", duration: 301 },
    ] } },
  },
});
mockPlayer({ title: "Вложенный", artist: "Группа", media: false });
st = await ask("getState", null);
assertEqual("page: вложенный ответ execute.multiple разобран", st.dur, 301);

// Провал запроса не должен ломать страницу.
window.__fetchBroken = true;
var rejected = false;
try {
  await window.fetch("https://api.vk.com/method/audio.get");
} catch (e) {
  rejected = true;
}
window.__fetchBroken = false;
assert("page: ошибка сети доходит до вызывающего", rejected === true);
mockPlayer({ title: "Кино", artist: "Дельфин", media: false });
st = await ask("getState", null);
assert("page: после ошибки скрипт продолжает работать", !!st && typeof st.title === "string");

// --- команды: play/pause и stop ---------------------------------------------

mockPlayer({ playing: false, media: false });
st = await ask("getState", null);
assertEqual("page: перед toggle плеер на паузе", st.playing, false);

var res = await ask("cmd", { action: "toggle" });
assert("page: toggle нажал кнопку плеера",
  !!res && res.ok === true && res.msg.indexOf("кнопка") === 0, JSON.stringify(res));
assertEqual("page: toggle нажал именно play/pause", window.__clicks.length, 1);
assertEqual("page: toggle нажал «Воспроизвести»", window.__clicks[0], "Воспроизвести");

st = await ask("getState", null);
assertEqual("page: после toggle плеер играет", st.playing, true);

res = await ask("cmd", { action: "toggle" });
assertEqual("page: второй toggle нажал ту же кнопку", window.__clicks.length, 2);
assertEqual("page: второй toggle нажал «Пауза»", window.__clicks[1], "Пауза");
st = await ask("getState", null);
assertEqual("page: после второго toggle плеер на паузе", st.playing, false);

// Кнопки нет - работаем с медиаэлементом напрямую.
document.body.innerHTML =
  '<div class="track-name"><div class="track-name__title">Без кнопок</div></div>';
var mediaOnly = document.createElement("audio");
mediaOnly.src = "https://vk.com/only.mp3";
document.body.appendChild(mediaOnly);
Object.defineProperty(mediaOnly, "paused", { value: true, configurable: true });

res = await ask("cmd", { action: "toggle" });
assert("page: без кнопки toggle работает через audio",
  !!res && res.ok === true && res.msg === "media-play", JSON.stringify(res));

// Ни кнопок, ни медиаэлемента - честная ошибка, а не молчание.
document.body.innerHTML =
  '<div class="track-name"><div class="track-name__title">Пусто</div></div>';
res = await ask("cmd", { action: "toggle" });
assert("page: без плеера toggle сообщает об ошибке",
  !!res && res.ok === false && res.msg.indexOf("не нашёл") === 0, JSON.stringify(res));

// stop: пауза и возврат в начало.
var a3 = mockPlayer({ playing: true, position: 120, duration: 300 });
res = await ask("cmd", { action: "stop" });
assert("page: stop отработал", !!res && res.ok === true, JSON.stringify(res));
assertEqual("page: stop вернул трек в начало", a3.currentTime, 0);

res = await ask("cmd", { action: "ерунда" });
assert("page: ерунда отклоняется", !!res && res.ok === false);

res = await ask("getState", null);
assert("page: после команд скрипт жив", !!res && typeof res.title === "string");

    done();
  } catch (e) {
    fail("набор page упал", e);
    doneError(e);
  }
})();
</script>
</body>
</html>
